name: Publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to validate and publish (for example v0.9.1)
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag }}
      PAWCHIVE_BLOCKLIST_DIR: ${{ github.workspace }}/.compat-blocklist/extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NguyenHuuCuongK18/Pawchive-blocklist
          ref: v1.0.0
          path: .compat-blocklist
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify the requested version tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$TAG" = "v$VERSION"
          git rev-parse --verify "refs/tags/$TAG"
          test -f "docs/releases/$TAG.md"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check
      - name: Publish verified ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" releases/*.zip releases/SHA256SUMS.txt --verify-tag --title "Pawchive Ripper $TAG" --notes-file "docs/releases/$TAG.md"
